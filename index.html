<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priya, Will You Be My Valentine? ❤️</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  font-family:'Segoe UI',sans-serif;
  overflow:hidden;
}

.card{
  position:relative;
  background:white;
  padding:45px 35px;
  border-radius:24px;
  box-shadow:0 25px 50px rgba(0,0,0,.25);
  text-align:center;
  max-width:420px;
  z-index:2;
}

h1{color:#ff3b6f}
p{color:#444;font-size:18px}

button{
  padding:14px 30px;
  font-size:17px;
  border:none;
  border-radius:30px;
  cursor:pointer;
}

.yes{
  background:#ff3b6f;
  color:white;
  margin-right:10px;
}

.no{
  background:#ddd;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.popup{
  background:linear-gradient(135deg,#ffdde1,#ee9ca7);
  padding:30px;
  border-radius:30px;
  text-align:center;
  animation:pop .6s ease;
  position:relative;
}

@keyframes pop{
  from{transform:scale(.5);opacity:0}
  to{transform:scale(1);opacity:1}
}

.popup img{
  max-width:260px;
  border-radius:20px;
  margin-top:15px;
}

.close{
  position:absolute;
  top:10px;
  right:15px;
  font-size:24px;
  cursor:pointer;
}

.ring{
  font-size:60px;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.3)}
}

/* Explosion */
.explode{
  animation:explode .6s forwards;
}
@keyframes explode{
  to{transform:scale(0);opacity:0}
}

.particle{
  position:fixed;
  font-size:22px;
  pointer-events:none;
  animation:particle .8s forwards;
}
@keyframes particle{
  to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}
}

/* Final screen */
.final{
  position:fixed;
  inset:0;
  background:black;
  color:white;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:48px;
  animation:fade 3s forwards;
  z-index:20;
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}
</style>
</head>

<body>

<audio id="music">
  <source src="cant_help_falling_in_love.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <h1>My Babu, Priya 💖</h1>
  <p>
    This isn’t just about Valentine’s Day.<br>
    It’s about choosing <b>you</b> — again and again — forever.<br><br>
    <b>Will you be my Valentine?</b>
  </p>
  <button class="yes" onclick="sayYes()">Yes 💕</button>
  <button class="no" id="noBtn">No 🙈</button>
</div>
