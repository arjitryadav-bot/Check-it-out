<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priya ❤️</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* CARD */
.card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  width: 90%;
  max-width: 420px;
  z-index: 2;
}

h1 { color: #ff3b6f; }

button {
  padding: 14px 28px;
  font-size: 16px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

.yes {
  background: #ff3b6f;
  color: white;
  margin-right: 10px;
}

.no {
  background: #ddd;
  color: #333;
}

/* OVERLAY */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 5;
}

/* POPUP */
.popup {
  background: #fff;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  width: 90%;
  max-width: 350px;
  position: relative;

  /* Heartbeat pulse animation */
  animation: pulse 1.2s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.03); }
  100% { transform: scale(1); }
}

.popup img {
  width: 100%;
  border-radius: 15px;
  margin-top: 10px;
}

.close {
  position: absolute;
  top: 8px;
  right: 12px;
  font-size: 22px;
  cursor: pointer;
}

/* EXPLOSION */
.explode {
  animation: explode 0.5s forwards;
}

@keyframes explode {
  to { transform: scale(0); opacity: 0; }
}

.particle {
  position: fixed;
  font-size: 22px;
  pointer-events: none;
  animation: particle 0.8s forwards;
}

@keyframes particle {
  to {
    transform: translate(var(--x), var(--y));
    opacity: 0;
  }
}

/* FINAL */
.final {
  position: fixed;
  inset: 0;
  background: black;
  color: white;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  z-index: 10;
  opacity: 0;
}
</style>
</head>

<body>

<!-- HEARTBEAT SOUND -->
<audio id="music" src="heartbeat.mp3" preload="auto" loop></audio>

<div class="card">
  <h1>My Babu, Priya 💖</h1>
  <p>
    This isn’t just Valentine’s Day.<br>
    It’s choosing you forever.<br><br>
    <b>Will you be my Valentine?</b>
  </p>

  <button class="yes" id="yesBtn">Yes 💕</button>
  <button class="no" id="noBtn">No 🙈</button>
</div>

<!-- PROPOSAL -->
<div class="overlay" id="proposal">
  <div class="popup">
    <div class="close" id="closeProposal">✖</div>
    <div style="font-size:50px;">💍</div>
    <img src="our_photo.jpg" alt="Us">
    <p><b>Forever & Always</b><br>Love, Arjit ❤️</p>
  </div>
</div>

<!-- SECRET -->
<div class="overlay" id="secret">
  <div class="popup">
    <h3>🔒 A Secret for You</h3>
    <input id="pass" type="password" placeholder="Password">
    <p><small>Hint: the day of proposal</small></p>
    <button id="unlockBtn">Unlock 💖</button>
  </div>
</div>

<div class="final" id="final">I LOVE YOU 💍</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const proposal = document.getElementById("proposal");
const closeProposal = document.getElementById("closeProposal");
const secret = document.getElementById("secret");
const unlockBtn = document.getElementById("unlockBtn");
const final = document.getElementById("final");
const music = document.getElementById("music");

/* YES BUTTON */
yesBtn.addEventListener("click", function() {
  proposal.style.display = "flex";

  music.volume = 0.8;
  music.currentTime = 0;
  music.load();

  music.play().catch(() => {
    document.body.addEventListener("click", function oneTimePlay() {
      music.play();
      document.body.removeEventListener("click", oneTimePlay);
    });
  });
});

/* CLOSE PROPOSAL */
closeProposal.addEventListener("click", function() {
  proposal.style.display = "none";
  secret.style.display = "flex";
});

/* UNLOCK SECRET */
unlockBtn.addEventListener("click", function() {
  const password = document.getElementById("pass").value;

  if (password === "12072025") {
    secret.innerHTML = `
      <div class="popup">
        I know I am not perfect and not always easy to be with.
        I may irritate you many times, but I truly love you and will
        do whatever it takes to be together forever.<br><br>
        I love you, Priya Bajpai, till my last breath.
      </div>
    `;

    // 10 second delay before final screen
    setTimeout(function() {
      final.style.display = "flex";
      final.style.transition = "opacity 2s";
      setTimeout(function() {
        final.style.opacity = "1";
      }, 100);
    }, 10000);

  } else {
    alert("Wrong password, Babu ❤️");
  }
});

/* NO BUTTON EXPLOSION */
noBtn.addEventListener("click", function() {
  noBtn.classList.add("explode");
  noBtn.disabled = true;

  const rect = noBtn.getBoundingClientRect();
  const emojis = ["💥","💔","🔥"];

  for (let i = 0; i < 15; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.innerText = emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left = rect.left + rect.width/2 + "px";
    p.style.top = rect.top + rect.height/2 + "px";
    p.style.setProperty("--x", (Math.random()*200-100)+"px");
    p.style.setProperty("--y", (Math.random()*200-100)+"px");
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
});

});
</script>

</body>
</html>
