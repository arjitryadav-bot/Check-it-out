<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priya ❤️</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  width: 90%;
  max-width: 420px;
}

h1 { color: #ff3b6f; }

button {
  padding: 14px 28px;
  font-size: 16px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

.yes {
  background: #ff3b6f;
  color: white;
  margin-right: 10px;
}

.no {
  background: #ddd;
  color: #333;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
}

.popup {
  background: #fff;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  width: 90%;
  max-width: 350px;
  position: relative;
}

.close {
  position: absolute;
  top: 8px;
  right: 12px;
  font-size: 22px;
  cursor: pointer;
}

.final {
  position: fixed;
  inset: 0;
  background: black;
  color: white;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  opacity: 0;
}
</style>
</head>

<body>

<!-- ONLINE AUDIO (Direct MP3) -->
<audio id="music" 
src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" 
loop>
</audio>

<div class="card">
  <h1>My Babu, Priya 💖</h1>
  <p>
    This isn’t just Valentine’s Day.<br>
    It’s choosing you forever.<br><br>
    <b>Will you be my Valentine?</b>
  </p>

  <button class="yes" id="yesBtn">Yes 💕</button>
  <button class="no" id="noBtn">No 🙈</button>
</div>

<div class="overlay" id="proposal">
  <div class="popup">
    <div class="close" id="closeProposal">✖</div>
    <div style="font-size:50px;">💍</div>
    <p><b>Forever & Always</b><br>Love, Arjit ❤️</p>
  </div>
</div>

<div class="final" id="final">I LOVE YOU 💍</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

const yesBtn = document.getElementById("yesBtn");
const proposal = document.getElementById("proposal");
const closeProposal = document.getElementById("closeProposal");
const final = document.getElementById("final");
const music = document.getElementById("music");

/* YES BUTTON */
yesBtn.addEventListener("click", function() {
  proposal.style.display = "flex";

  music.volume = 0.6;
  music.currentTime = 0;

  music.play().catch(err => {
    console.log("Playback issue:", err);
  });
});

/* CLOSE PROPOSAL */
closeProposal.addEventListener("click", function() {
  proposal.style.display = "none";

  setTimeout(function() {
    final.style.display = "flex";
    final.style.transition = "opacity 2s";
    setTimeout(() => {
      final.style.opacity = "1";
    }, 100);
  }, 10000);
});

});
</script>

</body>
</html>
