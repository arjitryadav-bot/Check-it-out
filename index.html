<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priya, Will You Be My Valentine? ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  font-family:'Segoe UI',sans-serif;
  overflow:hidden;
}

/* CARD */
.card{
  background:white;
  padding:45px 35px;
  border-radius:24px;
  text-align:center;
  max-width:420px;
  box-shadow:0 25px 50px rgba(0,0,0,.25);
  z-index:2;
}

h1{color:#ff3b6f;font-size:30px;}
p{color:#444;font-size:18px;line-height:1.5}

button{
  padding:14px 30px;
  font-size:17px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  transition:.25s ease;
}

.yes{background:#ff3b6f;color:white}
.no{background:#ddd;color:#333;position:absolute}

button:hover{
  transform:scale(1.08);
  box-shadow:0 12px 25px rgba(0,0,0,.25);
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:10;
}

/* POPUP */
.popup{
  background:linear-gradient(135deg,#ffdde1,#ee9ca7);
  padding:35px;
  border-radius:30px;
  text-align:center;
  animation:pop .8s cubic-bezier(.22,1,.36,1);
}

.popup img{
  max-width:260px;
  border-radius:20px;
  margin:15px 0;
  box-shadow:0 15px 30px rgba(0,0,0,.3);
}

@keyframes pop{
  from{transform:scale(.5);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* RING */
.ring{
  font-size:60px;
  animation:ringPulse 1.5s infinite;
}

@keyframes ringPulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.3) rotate(10deg)}
  100%{transform:scale(1)}
}

/* KNEE DOWN */
.knee{
  position:fixed;
  bottom:-120px;
  left:50%;
  transform:translateX(-50%);
  font-size:90px;
  animation:kneeDown 2s ease forwards;
  z-index:40;
}

@keyframes kneeDown{
  to{bottom:120px;}
}

/* CONFETTI */
.explosion{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:30px;
  animation:explode 1.4s cubic-bezier(.22,1,.36,1) forwards;
  pointer-events:none;
  z-index:50;
}

@keyframes explode{
  to{
    transform:
      translate(calc(-50% + var(--x)),
                calc(-50% + var(--y)))
      scale(0);
    opacity:0;
  }
}

/* ROSES */
.rose{
  position:fixed;
  top:-10px;
  font-size:26px;
  animation:fall linear infinite;
  z-index:5;
}

@keyframes fall{
  to{transform:translateY(110vh);}
}

/* FINAL LOVE SCREEN */
.final-love{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  animation:fadeIn 3s ease forwards;
  z-index:100;
}

.final-love h1{
  color:#ff5c8a;
  font-size:48px;
  animation:pulse 2.5s infinite;
  text-align:center;
}

@keyframes fadeIn{
  to{opacity:1;}
}

@keyframes pulse{
  0%{transform:scale(1);opacity:.8}
  50%{transform:scale(1.08);opacity:1}
  100%{transform:scale(1);opacity:.8}
}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="music" loop>
  <source src="cant_help_falling_in_love.mp3" type="audio/mpeg">
</audio>

<audio id="heartbeat" loop>
  <source src="heartbeat.mp3" type="audio/mpeg">
</audio>

<!-- MAIN CARD -->
<div class="card">
<h1>My Babu, Priya 💖</h1>
<p>
This isn’t just about Valentine’s Day.<br>
It’s about choosing <b>you</b> again and again,<br>
for the rest of my life.<br><br>
<b>Will you be my Valentine?</b>
</p>
<button class="yes" onclick="sayYes()">Yes 💕</button>
<button class="no" id="noBtn">No 🙈</button>
</div>

<!-- POPUP -->
<div class="overlay" id="overlay">
  <div class="popup">
    <div class="ring">💍</div>
    <img src="our_photo.jpg" alt="Arjit & Priya">
    <h2>Forever & Always 💖</h2>
    <p>You are my today, my tomorrow, and all my forever.</p>
    <p><b>Love, Arjit ❤️</b></p>
  </div>
</div>

<script>
const noBtn=document.getElementById("noBtn");
const overlay=document.getElementById("overlay");
const music=document.getElementById("music");
const heartbeat=document.getElementById("heartbeat");

noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("click",moveNo);

function moveNo(){
  noBtn.style.left=Math.random()*80+"vw";
  noBtn.style.top=Math.random()*80+"vh";
}

function sayYes(){
  music.play();
  heartbeat.volume=0.35;
  heartbeat.play();

  kneeDown();
  setTimeout(confettiExplosion,800);
  setTimeout(startRoses,1000);
  setTimeout(()=>overlay.style.display="flex",1600);
  setTimeout(showSecret,3200);
  setTimeout(finalLove,12000);
}

function kneeDown(){
  const k=document.createElement("div");
  k.className="knee";
  k.textContent="🧎‍♂️";
  document.body.appendChild(k);
}

function confettiExplosion(){
  const emojis=["🎉","💖","✨","🎈","🥳","🎆"];
  for(let i=0;i<100;i++){
    const e=document.createElement("div");
    e.className="explosion";
    e.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    e.style.setProperty("--x",(Math.random()*600-300)+"px");
    e.style.setProperty("--y",(Math.random()*600-300)+"px");
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),1400);
  }
}

function startRoses(){
  for(let i=0;i<30;i++){
    const r=document.createElement("div");
    r.className="rose";
    r.textContent="🌹";
    r.style.left=Math.random()*100+"vw";
    r.style.animationDuration=4+Math.random()*4+"s";
    document.body.appendChild(r);
  }
}

function showSecret(){
  const box=document.createElement("div");
  box.style.position="fixed";
  box.style.bottom="20px";
  box.style.left="50%";
  box.style.transform="translateX(-50%)";
  box.style.background="rgba(255,255,255,.95)";
  box.style.padding="20px";
  box.style.borderRadius="20px";
  box.style.zIndex="60";
  box.style.textAlign="center";
  box.innerHTML=`
  <b>🔒 A Secret Just for You</b><br><br>
  <input id="pass" type="password" placeholder="Password"
  style="padding:10px;border-radius:10px"><br><br>
  <small>Hint: the day of proposal</small><br><br>
  <button onclick="unlock()">Unlock 💖</button>`;
  document.body.appendChild(box);

  window.unlock=()=>{
    if(document.getElementById("pass").value==="12072025"){
      box.innerHTML=`💖<br>
      I know I am not perfect and not always easy to be with.
      I may act rudely or irritate you many times, but I truly love you
      and I am willing to do whatever it takes for us to be together forever.<br><br>
      I love you, Priya Bajpai, and I will love you until my very last breath.`;
    }else{
      alert("Try again, Babu 💕");
    }
  };
}

function finalLove(){
  const f=document.createElement("div");
  f.className="final-love";
  f.innerHTML="<h1>I love you, Priya ❤️</h1>";
  document.body.appendChild(f);
}
</script>

</body>
</html>
